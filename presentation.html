<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>العرض التفاعلي</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body class="player" data-theme="unit-1">
  <div class="progress" id="progress" style="width:0"></div>
  <div class="hint" id="hint">Space = التالي | ← → للتنقل | ت = تصفيق | ق = قرعة</div>
  <div class="p-badge" id="badge"></div>
  <div class="p-class" id="pclass" hidden></div>

  <!-- المسرح: 1600×900 ويُكبَّر تلقائيًا ليملأ الشاشة -->
  <main id="stage" aria-live="polite"></main>

  <!-- شريط التحكم السفلي -->
  <nav class="controls" id="controls" aria-label="أدوات العرض">
    <button id="b-prev" title="السابق (←)">← السابق</button>
    <span class="counter" id="counter"></span>
    <button id="b-next" title="التالي (→ أو Space)">التالي →</button>
    <span class="sep"></span>
    <button id="b-clap" title="تصفيق (ت)">👏</button>
    <button id="b-draw" title="قرعة الأسماء (ق)">🎲</button>
    <button id="b-plk" title="بليكرز">📊 بليكرز</button>
    <span class="sep"></span>
    <button id="b-fs" title="ملء الشاشة">⛶ ملء الشاشة</button>
    <button id="b-home" title="العودة للمكتبة (Esc)">🏠</button>
  </nav>

  <div class="fx" id="fx"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="data/lessons.js"></script>
  <script src="js/plickers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
